[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veille-agent"
version = "0.1.0"
description = "Agent de Veille Web Autonome — noyau logique (Lot 1, jalon J1)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
